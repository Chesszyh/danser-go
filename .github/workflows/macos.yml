name: macOS compatibility

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: dev-macos
      bundle-version:
        type: string
        default: '0.0.0'

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      DANSER_MACOS_DEPS_DIR: ${{ github.workspace }}/.deps/macos
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: third_party/osu/global.json
      - name: Install build and recording tools
        run: brew install cmake ninja ffmpeg
      - name: Check dependency cache failure handling
        run: |
          python3 tools/test_macos_deps.py
          python3 tools/test_macos_bundle_smoke.py
          python3 tools/license-preflight/test_collect_notices.py
          python3 tools/lazer-fonts/test_replace_restricted_fonts.py
          python3 tools/source-package/test_package_source.py
          python3 tools/test_publish_macos_release.py
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: .deps/macos
          key: macos-arm64-deps-${{ hashFiles('tools/macos-deps.sh') }}
      - name: Prepare native dependencies
        run: ./tools/macos-deps.sh
      - name: Cache verified native dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps/macos
          key: macos-arm64-deps-${{ hashFiles('tools/macos-deps.sh') }}
      - uses: actions/cache/restore@v4
        id: go-build-cache
        with:
          path: ~/Library/Caches/go-build
          key: macos-arm64-go-build-v2-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Test including native OpenGL regressions
        run: ./tools/macos-test.sh
      - name: Cache successful Go compilation
        if: steps.go-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/go-build
          key: macos-arm64-go-build-v2-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Build app and self-contained rules host
        run: ./dist-macos.sh "$DANSER_VERSION" "$BUNDLE_VERSION"
        env:
          DANSER_VERSION: ${{ inputs.version || 'dev-macos' }}
          BUNDLE_VERSION: ${{ inputs.bundle-version || format('0.0.{0}', github.run_number) }}
      - name: Verify relocated app with real replay
        run: python3 tools/macos-bundle-smoke.py
      - name: Archive verified bundle
        run: |
          test ! -f dist/build-macos/notices-incomplete
          python3 tools/source-package/package_source.py --repo "$PWD" --fetch \
            --resource-source "$PWD/.deps/lazer-resources/source" \
            --resource-kit "$PWD/tools/lazer-fonts" --require-open-font-sources
          ditto -c -k --keepParent dist/build-macos/danser.app dist/build-macos/danser-macos.zip
          cd dist/build-macos
          shasum -a 256 danser-macos.zip danser-macos-source.tar.gz danser-macos-source-manifest.json build-info.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: danser-macos
          path: |
            dist/build-macos/danser-macos.zip
            dist/build-macos/SHA256SUMS
            dist/build-macos/build-info.json
            dist/build-macos/danser-macos-source.tar.gz
            dist/build-macos/danser-macos-source-manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: danser-macos-verification
          path: dist/build-macos/verification
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve dependency notice inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: danser-macos-notices
          path: dist/build-macos/collected-notices
          if-no-files-found: ignore
          retention-days: 7
