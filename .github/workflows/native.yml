name: Linux and Windows

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: dev

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GOMAXPROCS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev libgtk-3-dev
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Install Windows compiler
        if: runner.os == 'Windows'
        uses: bwoodsend/setup-winlibs-action@v1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: third_party/osu/global.json
      - name: Test Go packages
        run: go test -p 2 -tags 'exclude_cimgui_glfw exclude_cimgui_sdli' ./...
      - name: Test distribution tooling
        if: runner.os == 'Linux'
        run: |
          python3 tools/test_macos_deps.py
          python3 tools/test_macos_bundle_smoke.py
          python3 tools/license-preflight/test_collect_notices.py
          python3 tools/lazer-fonts/test_replace_restricted_fonts.py
          python3 tools/source-package/test_package_source.py
          python3 tools/test_publish_macos_release.py
      - name: Build distribution with official rules
        env:
          DANSER_VERSION: ${{ inputs.version || 'dev' }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          version="$DANSER_VERSION"
          if [[ "$version" == dev ]]; then version=0.0.0-dev; fi
          bash "dist-$PLATFORM.sh" "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: danser-${{ matrix.platform }}
          path: dist/artifacts/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
