name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bundle-version: ${{ steps.version.outputs.bundle-version }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-lazer\.[0-9]+)?$ ]]
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bundle-version=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  native:
    needs: version
    uses: ./.github/workflows/native.yml
    with:
      version: ${{ needs.version.outputs.version }}

  macos:
    needs: version
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ needs.version.outputs.version }}
      bundle-version: ${{ needs.version.outputs.bundle-version }}

  publish:
    needs: [native, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: danser-linux
          path: artifacts/danser-linux
      - uses: actions/download-artifact@v4
        with:
          name: danser-macos
          path: artifacts/danser-macos
      - name: Publish verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          cp artifacts/danser-linux/*.zip release-assets/
          cp artifacts/danser-macos/* release-assets/
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$TAG" --json isDraft > release-state.json 2>/dev/null; then
            jq -e '.isDraft == true' release-state.json
          else
            gh release create "$TAG" --draft --verify-tag \
              --title "danser $TAG" --notes-file docs/releases/"$TAG".md "${flags[@]}"
          fi
          gh release upload "$TAG" release-assets/* --clobber
          gh release edit "$TAG" --draft=false
