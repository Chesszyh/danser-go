name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bundle-version: ${{ steps.version.outputs.bundle-version }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bundle-version=${version%%-*}" >> "$GITHUB_OUTPUT"

  native:
    needs: version
    uses: ./.github/workflows/native.yml
    with:
      version: ${{ needs.version.outputs.version }}

  macos:
    needs: version
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ needs.version.outputs.version }}
      bundle-version: ${{ needs.version.outputs.bundle-version }}

  publish:
    needs: [native, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: danser-*
          path: artifacts
      - name: Publish verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          cp artifacts/danser-linux/*.zip artifacts/danser-win/*.zip release-assets/
          cp artifacts/danser-macos/* release-assets/
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" release-assets/* --verify-tag \
            --title "danser $TAG" --notes-file docs/releases/"$TAG".md "${flags[@]}"
